name: smarttube_poc
description: "SmartTube Mobile PoC - Flutter (iOS + Android)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # YouTube extraction
  youtube_explode_dart: ^3.1.0

  # Video player (mpv-based)
  media_kit: ^1.1.0
  media_kit_video: ^1.0.0
  media_kit_libs_video: ^1.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^14.0.0

  # HTTP
  dio: ^5.5.0

  # Database
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0

  # Local storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.0

  # Background audio
  audio_service: ^0.18.0
  just_audio: ^0.9.0
  # Already present transitively; declared so main() can claim the iOS
  # `playback` category, without which iOS suspends audio on background.
  audio_session: ^0.1.25

  # UI utilities
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.0
  google_fonts: ^6.2.0

  # Models & Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  rxdart: ^0.28.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.0

  # Background updates
  package_info_plus: ^8.0.0
  version: ^3.0.0
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0

  # Code generation
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0

  # Testing
  mocktail: ^1.0.0
  golden_toolkit: ^0.15.0

  # Pinned so analyzer_plugin/custom_lint_visitor resolve to a mutually
  # compatible set (drift_dev 2.28 breaks against analyzer >=7.4)
  analyzer: 7.3.0
